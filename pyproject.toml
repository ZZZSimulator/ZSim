[build-system]
requires = ["setuptools>=75.1.0", "wheel>=0.41.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zsim*"]
exclude = [
    "results*",
    "tests*",
    "docs*",
    "build*",
    ".venv*",
    ".git*",
    "electron*",
    "dist*",
    "knowledge_base*",
]

[tool.pyinstaller]
# ZSim API 配置
spec_file = "zsim_api.spec"
console = true
clean = true
noconfirm = true


[project]
name = "zzz-simulator"
version = "0.3.5"
description = "A simulator for ZZZ game"
requires-python = ">=3.12"
dependencies = [
    "pandas~=2.2.3",
    "tqdm~=4.66.5",
    "numpy~=2.2.5",
    "dash~=2.18.2",
    "plotly~=6.0.0",
    "setuptools~=75.1.0",
    "streamlit~=1.44.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.11.3",
    "psutil>=7.0.0",
    "streamlit-ace>=0.1.1",
    "polars>=1.28.1",
    "pywebview>=5.4",
    "fastapi>=0.115.12",
    "uvicorn>=0.35.0",
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "dotenv>=0.9.9",
    "tomli-w>=1.2.0",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.5",
    "greenlet>=3.0.3",
    "pydantic-settings>=2.12.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q"]
ignore = ["E501"]
exclude = ["build", "dist", ".venv", "__pypackages__"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/run_*.py" = ["E402"]
"tests/simulator/*.py" = ["E402"]
"zsim/sim_progress/Buff/JudgeTools/__init__.py" = ["I001"]
"zsim/sim_progress/Preload/APLModule/SubConditionUnit/__init__.py" = ["I001"]
"zsim/sim_progress/Preload/PreloadEngine/SwapCancelValidateEngine.py" = ["I001"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "venv/*", ".venv/*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[project.scripts]
zsim = "zsim.run:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pyinstaller>=6.13.0",
    "pytest>=8.3.5",
    "viztracer>=1.0.3",
    "objprint>=0.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.1.0",
    "mypy>=1.17.1",
    "ruff>=0.12.12",
    "black>=25.11.0",
    "isort>=7.0.0",
    "pre-commit>=4.2.0",
]

[project.optional-dependencies]
windows = ["pywin32>=308"]
